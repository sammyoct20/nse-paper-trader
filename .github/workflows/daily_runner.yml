name: Hourly Algo Execution

on:
  schedule:
    # 1. Runs hourly at :45 UTC (3:45 AM to 9:45 AM UTC) -> 9:15 AM to 3:15 PM IST (Mon-Fri)
    - cron: '45 3-9 * * 1-5'
    
    # 2. Runs at 10:00 AM UTC -> 3:30 PM IST Market Close Check (Mon-Fri)
    - cron: '0 10 * * 1-5'

  workflow_dispatch:

jobs:
  run-paper-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Trading Engine & Sync Portfolio
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cron_runner.py
